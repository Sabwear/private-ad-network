name: Application validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check media processor
        run: pnpm worker:media:check

      - name: Build media processor
        run: pnpm worker:media:build

      - name: Build and inspect media processor container
        run: |
          docker build --file workers/media-processor/Dockerfile --tag loopline-media-processor:test .
          docker run --rm --entrypoint sh loopline-media-processor:test -c "ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264 && ffprobe -version"

      - name: Build portable Next.js application
        run: pnpm build
