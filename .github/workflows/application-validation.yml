name: Application validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check media processor
        run: pnpm worker:media:check

      - name: Build media processor
        run: pnpm worker:media:build

      - name: Build and inspect media processor container
        run: |
          docker build --file workers/media-processor/Dockerfile --tag loopline-media-processor:test .
          docker run --rm --entrypoint sh loopline-media-processor:test -c "ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264 && ffprobe -version"

      - name: Generate adaptive HLS smoke stream
        run: |
          docker run --rm --entrypoint sh loopline-media-processor:test -c '
            ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=1000 -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/input.mp4 &&
            node --input-type=module -e "import { generateAdaptiveHls } from \"./dist/media-tools.js\"; await generateAdaptiveHls(\"ffmpeg\", \"/tmp/input.mp4\", \"/tmp/hls\")" &&
            test -s /tmp/hls/master.m3u8 && test -s /tmp/hls/720p/index.m3u8 && test -s /tmp/hls/480p/index.m3u8 &&
            find /tmp/hls/720p -name "segment_*.ts" -type f | grep -q . && find /tmp/hls/480p -name "segment_*.ts" -type f | grep -q .
          '

      - name: Build portable Next.js application
        run: pnpm build
